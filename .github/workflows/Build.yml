name: Build DarkTV Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Release & Debug APK
        run: gradle assembleRelease assembleDebug --stacktrace

      - name: Upload Release APK (Ultra Lightweight)
        uses: actions/upload-artifact@v4
        with:
          name: DarkTV-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DarkTV-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
